services:
  postgres:
    image: postgres:16-alpine
    container_name: echosense-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: echosense_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: